name: rami
description: رامي — تطبيق إدارة ومتابعة حسابات الموردين (يعمل بدون إنترنت).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  share_plus: ^10.1.2
  file_picker: ^10.3.3
  local_auth: ^2.3.0
  crypto: ^3.0.5
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
